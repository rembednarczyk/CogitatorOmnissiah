services:
  - type: web
    name: cogitator-omnissiah
    runtime: node
    plan: free
    # --include=dev: build tools live in devDependencies; ensure they install
    # for the build even if the environment omits devDeps.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NOTION_API_KEY
        sync: false
      - key: NOTION_DATABASE_ID
        sync: false
      # Opcjonalna ochrona hasłem (ustaw obie, aby wymusić Basic Auth):
      - key: BASIC_AUTH_USER
        sync: false
      - key: BASIC_AUTH_PASSWORD
        sync: false
