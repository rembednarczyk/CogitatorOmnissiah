# UWAGA: ten plik NIE jest obecnie podpięty jako Blueprint w Renderze — serwis
# powstał ręcznie z dashboardu, więc Render tego pliku NIE czyta. Trzymamy go
# jako dokumentację konfiguracji (i punkt wyjścia, gdyby serwis trzeba było
# kiedyś odtworzyć). Gdybyś podpinał go jako Blueprint: Render dopasowuje
# serwisy WYŁĄCZNIE po polu `name`, więc musi ono wtedy dokładnie odpowiadać
# nazwie istniejącego serwisu, inaczej powstanie drugi, równoległy serwis.
services:
  - type: web
    name: librem
    runtime: node
    plan: free
    # --include=dev: build tools live in devDependencies; ensure they install
    # for the build even if the environment omits devDeps.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NOTION_API_KEY
        sync: false
      - key: NOTION_DATABASE_ID
        sync: false
      # WYMAGANE w produkcji: bez obu wartości serwis odpowiada 503 na wszystko
      # poza /api/health (fail-closed — patrz middleware/basicAuth.ts). Wpisz je
      # w dashboardzie; `sync: false` oznacza, że blueprint ich NIE dostarcza.
      - key: BASIC_AUTH_USER
        sync: false
      - key: BASIC_AUTH_PASSWORD
        sync: false
